[package]
name = "webcortex-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing the WebCortex runtime to Python as webcortex._core."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
webcortex-core = { path = "../webcortex-core" }
# No abi3: the free-threaded builds we target expose a distinct ABI, so the
# stable-ABI feature cannot be combined with them.
# Pinned to 0.29.2 rather than "0.29" so the lockfile has to move: 0.29.1 fails
# to import on CPython 3.14.7 with "module functions cannot set METH_CLASS or
# METH_STATIC", and 0.29.2 fixes it. See AGENTS.md §11.
pyo3 = { version = "0.29.2", features = ["extension-module"] }
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
