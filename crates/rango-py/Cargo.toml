[package]
name = "rango-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing the Rango runtime to Python as rango._core."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
rango-core = { path = "../rango-core" }
# No abi3: the free-threaded builds we target expose a distinct ABI, so the
# stable-ABI feature cannot be combined with them.
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
