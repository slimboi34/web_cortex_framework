[package]
name = "pylon-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing the Pylon runtime to Python as pylon._core."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pylon-core = { path = "../pylon-core" }
# No abi3: the free-threaded builds we target expose a distinct ABI, so the
# stable-ABI feature cannot be combined with them.
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
tracing.workspace = true
