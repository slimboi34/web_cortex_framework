name: Release

# Publishing is deliberately gated on a tag, not on a push to main: a release
# should be an explicit act with a name attached to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI already builds every wheel and the sdist on each push, and uploads them
  # as `wheels-*`. Those are the artifacts this workflow publishes — it does not
  # rebuild them.
  #
  # The point is not only brevity. Rebuilding here meant the thing tested and
  # the thing published were different builds, produced by duplicated config
  # that could drift apart silently. Now there is one build, and the release is
  # the act of uploading what CI already proved.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Trusted publishing: no API token stored anywhere. The publisher is
    # configured at
    # https://pypi.org/manage/project/web-cortex-framework/settings/publishing/
    # and must name this workflow and this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: What is being published
        run: ls -lh dist

      # skip-existing makes a re-run a no-op rather than a failure: PyPI files
      # are immutable, so a second attempt at an already-published version would
      # otherwise fail on the first file it recognises.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
