name: Release

# Publishing is deliberately gated on a tag, not on a push to main: a release
# should be an explicit act with a name attached to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never publish something that has not passed the same gates as a normal push.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Wheel ${{ matrix.target }} (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          # Native ARM runner rather than cross-compilation: `ring`'s ARM
          # assembly fails to cross-build ("ARM assembler must define
          # __ARM_ARCH"), and building natively sidesteps the whole problem.
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          # Intel macOS is cross-compiled from the ARM runner: GitHub has retired
          # the macos-13 Intel runners, and Apple's toolchain targets both
          # architectures natively, so this needs no cross setup.
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --interpreter 3.12 3.13 3.14 3.14t
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    # Trusted publishing: no API token stored anywhere. Configure the publisher
    # at https://pypi.org/manage/project/web-cortex-framework/settings/publishing/
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # As an annotation rather than plain stdout, for the same reason as the
      # OIDC check below: this is the other half of any upload failure, and
      # reading it should not require pulling the whole job log.
      - name: List artifacts
        run: |
          python - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("dist").iterdir())
          listing = ", ".join(f"{f.name} ({f.stat().st_size // 1024} KiB)" for f in files)
          print(f"::notice title=dist ({len(files)} files)::{listing}")
          for f in files:
              print(f"{f.stat().st_size:>12}  {f.name}")
          PY

      # Do the OIDC exchange ourselves first, purely to report the outcome.
      #
      # When trusted publishing is misconfigured, gh-action-pypi-publish fails
      # with the reason buried in a ~60 KB job log, which is a miserable way to
      # learn that a form field has a typo in it. PyPI's mint-token endpoint
      # returns a precise error — `invalid-publisher` along with the claims it
      # actually saw — so asking it directly turns "the publish step failed"
      # into "PyPI expected repo X, workflow Y, environment Z".
      #
      # This does not replace the publish step and never blocks it: it only ever
      # annotates. The token minted here is discarded.
      - name: Install twine
        run: pip install --disable-pip-version-check --quiet twine

      - name: Report the trusted-publishing exchange
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          def annotate(level, title, message):
              one_line = " ".join(str(message).split())
              print(f"::{level} title={title}::{one_line}")

          url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not (url and token):
              annotate("warning", "OIDC unavailable",
                       "No id-token request URL. The job needs permissions.id-token: write.")
              raise SystemExit(0)

          req = urllib.request.Request(
              f"{url}&audience=pypi", headers={"Authorization": f"bearer {token}"}
          )
          oidc = json.load(urllib.request.urlopen(req, timeout=30))["value"]

          mint = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=json.dumps({"token": oidc}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(mint, timeout=30) as resp:
                  body = json.load(resp)
              if body.get("token"):
                  annotate("notice", "Trusted publishing OK",
                           "PyPI accepted the OIDC identity and issued a scoped token.")
              else:
                  annotate("error", "Trusted publishing rejected", body)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")
              annotate("error", f"Trusted publishing rejected ({exc.code})", detail)
              raise SystemExit(0)

          # Attempt the upload directly, so PyPI's own rejection is legible.
          #
          # By this point the identity is known good and the artifacts are known
          # well-formed, which means the only remaining explanation lives in the
          # HTTP response to the upload — and that is precisely the thing the
          # action buries. twine surfaces it, so ask twine.
          #
          # --skip-existing keeps this idempotent: on a re-run it is a no-op
          # rather than a "file already exists" failure.
          import subprocess, pathlib, sys
          files = [str(p) for p in sorted(pathlib.Path("dist").iterdir())]
          proc = subprocess.run(
              # --verbose is what makes PyPI's response *body* appear. Without
              # it twine prints only the status line, which for this failure is
              # the uninformative "400 Bad Request from .../legacy/ Bad Request".
              [sys.executable, "-m", "twine", "upload", "--non-interactive",
               "--verbose", "--skip-existing", "--disable-progress-bar", *files],
              env={**os.environ,
                   "TWINE_USERNAME": "__token__",
                   "TWINE_PASSWORD": body["token"],
                   "TWINE_REPOSITORY_URL": "https://upload.pypi.org/legacy/"},
              capture_output=True, text=True,
          )
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)
          if proc.returncode == 0:
              annotate("notice", "Upload accepted",
                       "PyPI accepted every file in dist.")
          else:
              # --verbose makes the output long, and the explanation is rarely
              # the last line — it sits in the response body a little above the
              # traceback. Pull the lines that carry meaning and fall back to the
              # tail only if none match, rather than truncating blindly.
              combined = f"{proc.stdout}\n{proc.stderr}".splitlines()
              signal = [
                  ln.strip() for ln in combined
                  if any(k in ln for k in ("400", "403", "Bad Request", "ERROR",
                                           "Uploading", "not allowed", "already",
                                           "invalid", "Invalid", "reason"))
              ]
              picked = signal[-12:] or [ln.strip() for ln in combined if ln.strip()][-12:]
              annotate("error", f"PyPI rejected the upload (exit {proc.returncode})",
                       " | ".join(picked))
          PY

      # skip-existing, because the diagnostic step above may already have
      # uploaded these files. This step remains the real publisher — it is the
      # one that mints and attaches PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
