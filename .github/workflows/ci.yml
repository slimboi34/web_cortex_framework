name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml reuses this workflow as its gate.
  workflow_call:

# Nothing here writes to the repository. release.yml grants its publish job
# `id-token: write` itself; this workflow only needs to read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on ephemeral runners and cost disk.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous against cold-cache runs; a hung job should not burn six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p webcortex-core --all-features
      # Warnings are errors here: this is where a real defect gets caught for
      # free, and a warning nobody fails on is a warning nobody reads.
      - run: cargo clippy -p webcortex-core --all-targets -- -D warnings

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.14t"]
        exclude:
          # Keep the matrix affordable; macOS covers the free-threaded path.
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Key on the manifests, not just Cargo.lock.
          #
          # rust-cache hashes Cargo.lock by default. That is not enough: when
          # Cargo.toml required pyo3 0.29.2 while Cargo.lock still said 0.29.1,
          # cargo resolved the newer version at build time and built correctly —
          # but the lock never changed, so the cache key never changed, and every
          # job restored objects compiled against 0.29.1. `_core` then failed to
          # import on 3.14 for a day after the fix had already landed.
          #
          # Including Cargo.toml means a dependency change invalidates the cache
          # even when the lock lags behind it.
          #
          # The interpreter is part of the key too, and this is the important
          # half. rust-cache keys on the job id, and every entry of this matrix
          # shares the id `python` — so 3.12, 3.13, 3.14 and 3.14t on one OS
          # were sharing a single cache. pyo3-ffi's build script configures
          # itself against the interpreter it is built with (ABI flags,
          # Py_GIL_DISABLED), and cargo's fingerprint does not include the
          # interpreter, so a GIL-enabled 3.14 job that restored objects built
          # by the free-threaded job imported a module compiled for the wrong
          # ABI: `ValueError: module functions cannot set METH_CLASS or
          # METH_STATIC`. Which job won the race to save the cache decided
          # whether the next run passed — the "same commit passed at 09:54 and
          # failed at 10:17" mystery below.
          key: py${{ matrix.python }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}

      - uses: astral-sh/setup-uv@v5
      - name: Build and test
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install maturin pytest
          source .venv/bin/activate
          # The exact patch release matters. `3.14` is a moving target — uv
          # hands out whatever the newest build is at the time the runner runs,
          # which is why the same commit passed at 09:54 and failed at 10:17.
          # Without this line the log gives no way to tell those two apart.
          python -c "import sys; print(f'::notice title=interpreter::{sys.implementation.name} {sys.version}')"
          maturin develop --uv
          # Import the COMPILED extension explicitly. The obvious smoke check —
          # `import webcortex; webcortex.free_threaded()` — proves nothing about
          # it: free_threaded() lives in _bridge.py and only reads
          # sys._is_gil_enabled, so it passes cleanly on a build whose native
          # module cannot load at all. When that happened on CPython 3.14 the
          # first thing to actually import _core was a server subprocess inside
          # a module-scoped fixture, so a one-line binding failure surfaced as
          # forty unexplained fixture errors several minutes later.
          #
          # The failure is also raised as a workflow annotation. A binding error
          # is one line; without an annotation the only way to read that line is
          # to pull the whole ~60 KB job log, which is a poor trade for one line
          # and is awkward from anything but a browser.
          python - <<'PY'
          import sys, traceback
          try:
              from webcortex import _core
          except Exception as exc:
              detail = f"{type(exc).__name__}: {exc}"
              print(f"::error title=_core failed to import on CPython {sys.version.split()[0]}::{detail}")
              traceback.print_exc()
              raise SystemExit(1)
          print("_core ok", _core.__version__)
          PY
          python -c "import webcortex; print(webcortex.__version__, 'free_threaded=', webcortex.free_threaded())"
          pytest tests/ -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # Run the binary directly rather than via an action wrapper, so the
      # documented exceptions in .cargo/audit.toml are honoured. The critical
      # JWT finding in v0.3 was a dependency feature-flag issue — exactly the
      # class this catches automatically.
      - run: cargo audit

  # Proves the wheel matrix builds on every push, so a release is never the
  # first time a platform is attempted.
  wheels:
    name: Wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Four release builds per job; Windows is the slowest.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          # Native ARM runner rather than cross-compilation: `ring`'s ARM
          # assembly fails to cross-build ("ARM assembler must define
          # __ARM_ARCH"), and building natively sidesteps the whole problem.
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          # Intel macOS is cross-compiled from the ARM runner: GitHub has retired
          # the macos-13 Intel runners, and Apple's toolchain targets both
          # architectures natively, so this needs no cross setup.
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # PyO3 without abi3 needs one wheel per interpreter version.
          args: >-
            --release
            --out dist
            --interpreter 3.12 3.13 3.14 3.14t
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
