[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# The import name is `rango`; the distribution name carries a suffix because
# `rango` on PyPI is held by an abandoned v0.0.2a package. Same split as
# djangorestframework -> `import rest_framework`.
name = "rango-framework"
version = "0.3.0"
description = "A Rust-cored Python web framework where every route is also an agent tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["web", "framework", "api", "agent", "mcp", "rust", "free-threaded"]

[project.urls]
Homepage = "https://github.com/slimboi34/rango"
Repository = "https://github.com/slimboi34/rango"
Changelog = "https://github.com/slimboi34/rango/blob/main/CHANGELOG.md"
Security = "https://github.com/slimboi34/rango/blob/main/SECURITY.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rango = "rango.cli:main"

[tool.maturin]
manifest-path = "crates/rango-py/Cargo.toml"
python-source = "python"
module-name = "rango._core"
features = []
