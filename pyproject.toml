[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Distribution name is `web-cortex-framework`; the import name is `webcortex`.
# Both are available on PyPI — the split is for ergonomics, not necessity, the
# same way djangorestframework imports as `rest_framework`.
name = "web-cortex-framework"
version = "0.3.0"
description = "A Rust-cored Python web framework where every route is also an agent tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["web", "framework", "api", "agent", "mcp", "rust", "free-threaded"]

dependencies = []

[project.urls]
Homepage = "https://github.com/slimboi34/web_cortex_framework"
Repository = "https://github.com/slimboi34/web_cortex_framework"
Changelog = "https://github.com/slimboi34/web_cortex_framework/blob/main/CHANGELOG.md"
Security = "https://github.com/slimboi34/web_cortex_framework/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
webcortex = "webcortex.cli:main"

[tool.maturin]
manifest-path = "crates/webcortex-py/Cargo.toml"
python-source = "python"
module-name = "webcortex._core"
features = []

# LICENSE has to be shipped in the sdist explicitly.
#
# `license = { text = "Apache-2.0" }` above makes maturin write
# `License-File: LICENSE` into the metadata, and PyPI enforces that claim: it
# rejects a distribution whose declared License-File is not actually inside it,
# with `400 License-File LICENSE does not exist in distribution file`.
#
# Wheels were unaffected — maturin copies LICENSE into the .dist-info itself —
# so all twenty uploaded and only the sdist was refused. The sdist is built from
# the crate at manifest-path, and LICENSE lives at the repository root, outside
# it, so nothing pulled it in.
include = [{ path = "LICENSE", format = "sdist" }]
