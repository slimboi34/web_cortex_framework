[workspace]
members = ["crates/rango-core", "crates/rango-py"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/slimboi34/rango"
homepage = "https://github.com/slimboi34/rango"
documentation = "https://docs.rs/rango-core"
keywords = ["web", "framework", "agent", "mcp", "python"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
matchit = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset", "http2"] }
minijinja = { version = "2.22", features = ["loader", "builtins"] }
# Both features are load-bearing. Without a crypto provider (`rust_crypto` or
# `aws_lc_rs`) jsonwebtoken *panics* inside `decode` — reachable by any
# unauthenticated client sending an Authorization header. Without `use_pem` the
# RSA/EC PEM parsers vanish and only HMAC works. rust_crypto is pure Rust and
# covers HS, RS, ES, and EdDSA.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "fast-rng"] }
mime_guess = "2"
async-stream = "0.3"
pin-project-lite = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Deliberately not `panic = "abort"`: a panic inside one request handler must
# unwind and fail that request, not take the whole server down with it.

# Incremental compilation artifacts reached several GB across rebuild cycles
# during development. The workspace rebuilds fast enough without them.
[profile.dev]
incremental = false
